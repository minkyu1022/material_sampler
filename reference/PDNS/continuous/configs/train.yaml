defaults:
  - _self_
  - experiment: grid_gmm

project: pce_sampling
exp: null
seed: 0
chem: false
dryrun: false

# fix_gamma
fix_gamma: 0.0

# clip
clip_term_norm: False
clip_grad_norm: 100.0
clip_adv_max: 100.0
clip_adv_min: 0.0

# parameterization type
param_type: 'adjoint' # 'adjoint', 'control'
loss_type: 'control' # 'adjoint', 'control'

# fix
checkpoint: null
save_freq: 100

timesteps:
  t0: 0.0
  t1: 1.0
  steps: ${nfe}
  rescale_t: ${rescale_t}

# === hardward related  ===
resample_batch_size: 2000 # gpu-specific; prev buffer_batch_size
train_batch_size: 500 # gpu-specific
eval_batch_size: 2000
quick_evaluation: False
