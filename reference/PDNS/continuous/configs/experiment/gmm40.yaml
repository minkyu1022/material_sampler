# @package _global_

defaults:
  - /source: gauss
  - /energy: gmm40
  - /sde@ref_sde: vp
  - /model@controller: clipped
  - /scheduler@gamma_scheduler: adaptive
  - /sde@annealed_sde: annealing_sde

# === problem ===
dim: 50
plot_lim: 50

# === sde ===
nfe: 1000
rescale_t: null # quad, cosine
zero_last_step_noise: true
sigma: 40.0
sigma_max: ${sigma}
sigma_min: 0.0001
beta0: 10.0
beta1: 0.1

# === annealed sde ===
annealing_beta0: ${beta0}
annealing_beta1: ${beta1}
annealing_type: 'annealed'
max_grad_E_norm: 100

# === step parameters (IMPORTANT!!) ===
gamma: 1.0
epsilon: 0.1
alpha: 1.0

# === solver ===
iws: true
annealed: true
cumulate: false
score_matcher:
  buffer_size: 10000
  duplicates: 1

# === network ===
num_layers: 4
channels: 2048


# === training ===
num_epochs: 10000
ema_decay: 0.999
num_epochs_per_stage: 1000

optim:
  lr: 1e-4
  weight_decay: 0.0
  beta1: 0.0
  beta2: 0.9

# === eval & logging ===
use_wandb: true
eval_freq: 10
eval_grid_points: 500