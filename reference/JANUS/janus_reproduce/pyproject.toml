[project]
name = "janus-reproduce"
version = "0.1.0"
description = "Reproduction code for JANUS hybrid neural samplers"
requires-python = ">=3.11,<3.13"
dependencies = [
  "ase>=3.25",
  "matplotlib>=3.8",
  "numpy>=1.26,<3",
  "scipy>=1.12",
  "torch>=2.7,<2.8",
  "wandb>=0.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/janus_reproduce"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
